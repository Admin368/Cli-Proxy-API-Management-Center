<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Web UI</title><style>
:root{color-scheme:light dark;font:16px system-ui;background:light-dark(#f5f6f8,#151619);color:light-dark(#172032,#eef1f6)}body{margin:0;padding:32px}main{max-width:720px;margin:auto}h1{font-size:28px;margin-bottom:8px}p{line-height:1.6;color:light-dark(#566174,#adb5c5)}section{border:1px solid light-dark(#d9deea,#373c48);border-radius:16px;padding:24px;margin-top:24px;background:light-dark(white,#1d2027)}.status{font-size:20px;font-weight:650;margin-bottom:8px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button,a{font:inherit;border:1px solid light-dark(#c9d0dd,#555e70);border-radius:9px;padding:11px 17px;cursor:pointer;background:light-dark(#f8f9fc,#292f3a);color:inherit;text-decoration:none}button:disabled,a[aria-disabled=true]{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #578ae8;outline-offset:3px}#error{color:light-dark(#ae2b20,#ffb3ab);white-space:pre-wrap}code{overflow-wrap:anywhere}small{display:block;margin-top:20px;line-height:1.6;color:light-dark(#566174,#adb5c5)}@media(max-width:500px){body{padding:16px}section{padding:18px}}
</style></head><body><main><h1 id="title"></h1><p id="intro"></p><section><div class="status" id="status" role="status" aria-live="polite"></div><code id="url"></code><div class="row"><button id="start" disabled></button><button id="stop" disabled></button><a id="open" target="_blank" rel="noopener noreferrer" aria-disabled="true"></a><button id="refresh"></button></div><p id="error" role="alert"></p><small id="note"></small></section></main><script>
const messages={
en:{title:'Custom Web UI',intro:'Control your custom management dashboard from EasyCLIProxyAPI.',start:'Start server',stop:'Stop server',open:'Open dashboard',refresh:'Refresh',loading:'Checking server…',running:'Server running',starting:'Server starting…',stopped:'Server stopped',external:'Server running outside this plugin',note:'Stop affects only the server started by this plugin. The proxy core keeps running. The managed UI server stops when the core exits or this plugin is disabled.',auth:'Open this panel inside EasyCLIProxyAPI to use its signed-in connection.',failed:'Could not reach the controller.'},
'zh-CN':{title:'自定义 Web 界面',intro:'在 EasyCLIProxyAPI 中控制自定义管理面板。',start:'启动服务器',stop:'停止服务器',open:'打开面板',refresh:'刷新',loading:'正在检查服务器…',running:'服务器正在运行',starting:'服务器正在启动…',stopped:'服务器已停止',external:'服务器由此插件之外的程序启动',note:'停止仅影响此插件启动的服务器，代理核心继续运行。核心退出或插件禁用时，管理界面服务器停止。',auth:'请在 EasyCLIProxyAPI 中打开此面板，使用已登录的连接。',failed:'无法连接控制器。'},
'zh-TW':{title:'自訂 Web 介面',intro:'在 EasyCLIProxyAPI 中控制自訂管理面板。',start:'啟動伺服器',stop:'停止伺服器',open:'開啟面板',refresh:'重新整理',loading:'正在檢查伺服器…',running:'伺服器正在執行',starting:'伺服器正在啟動…',stopped:'伺服器已停止',external:'伺服器由此插件之外的程式啟動',note:'停止僅影響此插件啟動的伺服器，代理核心繼續執行。核心退出或插件停用時，管理介面伺服器停止。',auth:'請在 EasyCLIProxyAPI 中開啟此面板，使用已登入的連線。',failed:'無法連接控制器。'},
ru:{title:'Пользовательский веб-интерфейс',intro:'Управляйте своей панелью из EasyCLIProxyAPI.',start:'Запустить сервер',stop:'Остановить сервер',open:'Открыть панель',refresh:'Обновить',loading:'Проверка сервера…',running:'Сервер работает',starting:'Сервер запускается…',stopped:'Сервер остановлен',external:'Сервер запущен вне этого плагина',note:'Останавливается только сервер этого плагина. Ядро прокси продолжает работу. Сервер интерфейса останавливается при выходе ядра или отключении плагина.',auth:'Откройте панель в EasyCLIProxyAPI с активным подключением.',failed:'Контроллер недоступен.'},
vi:{title:'Giao diện Web tùy chỉnh',intro:'Điều khiển bảng quản lý tùy chỉnh từ EasyCLIProxyAPI.',start:'Khởi động máy chủ',stop:'Dừng máy chủ',open:'Mở bảng quản lý',refresh:'Làm mới',loading:'Đang kiểm tra…',running:'Máy chủ đang chạy',starting:'Đang khởi động…',stopped:'Máy chủ đã dừng',external:'Máy chủ chạy ngoài plugin này',note:'Chỉ dừng máy chủ do plugin này khởi động. Proxy vẫn chạy. Máy chủ giao diện dừng khi lõi thoát hoặc plugin bị tắt.',auth:'Mở bảng này trong EasyCLIProxyAPI để dùng kết nối đã đăng nhập.',failed:'Không thể kết nối bộ điều khiển.'},
ko:{title:'사용자 지정 웹 UI',intro:'EasyCLIProxyAPI에서 사용자 지정 관리 화면을 제어합니다.',start:'서버 시작',stop:'서버 중지',open:'관리 화면 열기',refresh:'새로 고침',loading:'서버 확인 중…',running:'서버 실행 중',starting:'서버 시작 중…',stopped:'서버 중지됨',external:'이 플러그인 외부에서 실행 중인 서버',note:'이 플러그인이 시작한 서버만 중지하며 프록시 코어는 계속 실행됩니다. 코어가 종료되거나 플러그인이 비활성화되면 UI 서버도 중지됩니다.',auth:'로그인된 연결을 사용하려면 EasyCLIProxyAPI에서 이 화면을 여세요.',failed:'컨트롤러에 연결할 수 없습니다.'}
};
const locale=navigator.language||'en';const language=locale.toLowerCase().startsWith('zh')?(locale.includes('TW')||locale.includes('HK')?'zh-TW':'zh-CN'):locale.split('-')[0];const t=messages[language]||messages.en;document.documentElement.lang=language;for(const id of ['title','intro','start','stop','open','refresh','note'])document.getElementById(id).textContent=t[id];document.title=t.title;
let busy=false,last=null;const start=document.getElementById('start'),stop=document.getElementById('stop'),open=document.getElementById('open'),error=document.getElementById('error'),status=document.getElementById('status');status.textContent=t.loading;
function key(){try{return JSON.parse(localStorage.getItem('cli-proxy-auth'))?.state?.managementKey||''}catch{return ''}}
function render(s){last=s;status.textContent=s.starting?t.starting:s.running?(s.managed?t.running:t.external):t.stopped;document.getElementById('url').textContent=s.url;open.href=s.url+'#/quota/forecast';open.setAttribute('aria-disabled',String(!s.running));start.disabled=busy||s.running||s.managed;stop.disabled=busy||!s.managed;error.textContent=s.error||''}
open.addEventListener('click',e=>{if(!last?.running)e.preventDefault()});
async function request(action){if(busy)return;const token=key();if(!token){status.textContent=t.auth;return}busy=true;if(last)render(last);try{const response=await fetch('/v0/management/plugins/custom-web-ui/'+action,{method:action==='status'?'GET':'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:action==='status'?undefined:'{}',cache:'no-store'});if(response.status===401||response.status===403)throw Error(t.auth);const data=await response.json();if(typeof data.running!=='boolean')throw Error(t.failed);render(data)}catch(e){if(last)last={...last,error:e.message||t.failed};else{status.textContent=t.failed;error.textContent=e.message||t.failed}}finally{busy=false;if(last)render(last)}}
start.onclick=()=>request('start');stop.onclick=()=>request('stop');document.getElementById('refresh').onclick=()=>request('status');request('status');setInterval(()=>{if(!document.hidden)request('status')},2500);
</script></body></html>
